name: Build ApexTrack Windows Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron dependencies
        run: npm install -D electron electron-builder
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache

      - name: Build Windows installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ApexTrack-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: ApexTrack-Windows-Installer
          path: dist/ApexTrack-Setup.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ApexTrack-Setup.exe
          name: ApexTrack ${{ github.ref_name }}
          body: |
            ## ApexTrack Desktop App for Windows

            ### Install Instructions
            1. Download **ApexTrack-Setup.exe** below
            2. Double-click to run the installer
            3. ApexTrack will be installed to your PC with a Desktop shortcut and Start Menu entry

            ### System Requirements
            - Windows 10 or later (64-bit)
            - Internet connection required
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
