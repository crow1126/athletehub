name: Build ApexTrack Windows Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Windows installer (.exe)
        run: npx electron-builder --win nsis --x64

      - name: Upload ApexTrack-Setup.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexTrack-Windows-Installer
          path: dist/ApexTrack-Setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release with installer download
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ApexTrack-Setup.exe
          name: "ApexTrack ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            # ApexTrack Desktop App for Windows

            Download the installer below and run it to install **ApexTrack** as a native Windows application.

            ## How to Install
            1. Click **ApexTrack-Setup.exe** below to download
            2. Double-click the downloaded file to run the installer
            3. Follow the setup wizard
            4. ApexTrack will be installed with:
               - Desktop shortcut
               - Start Menu entry
               - Taskbar pin option

            ## System Requirements
            - Windows 10 / 11 (64-bit)
            - Internet connection required (app connects to your club's ApexTrack account)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
