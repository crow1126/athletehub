name: Build Capacitor Native Mobile Apps (iOS & Android)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Native App (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java Version
        run: java -version

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Inject ApexTrack App Icons
        run: |
          # ImageMagick is pre-installed on ubuntu-latest
          SRC="public/icons/app-icon-source.jpg"
          RES="android/app/src/main/res"
          # Standard Android mipmap sizes (px): mdpi=48, hdpi=72, xhdpi=96, xxhdpi=144, xxxhdpi=192
          convert "$SRC" -resize 48x48!   "$RES/mipmap-mdpi/ic_launcher.png"
          convert "$SRC" -resize 48x48!   "$RES/mipmap-mdpi/ic_launcher_round.png"
          convert "$SRC" -resize 48x48!   "$RES/mipmap-mdpi/ic_launcher_foreground.png"
          convert "$SRC" -resize 72x72!   "$RES/mipmap-hdpi/ic_launcher.png"
          convert "$SRC" -resize 72x72!   "$RES/mipmap-hdpi/ic_launcher_round.png"
          convert "$SRC" -resize 72x72!   "$RES/mipmap-hdpi/ic_launcher_foreground.png"
          convert "$SRC" -resize 96x96!   "$RES/mipmap-xhdpi/ic_launcher.png"
          convert "$SRC" -resize 96x96!   "$RES/mipmap-xhdpi/ic_launcher_round.png"
          convert "$SRC" -resize 96x96!   "$RES/mipmap-xhdpi/ic_launcher_foreground.png"
          convert "$SRC" -resize 144x144! "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert "$SRC" -resize 144x144! "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          convert "$SRC" -resize 144x144! "$RES/mipmap-xxhdpi/ic_launcher_foreground.png"
          convert "$SRC" -resize 192x192! "$RES/mipmap-xxxhdpi/ic_launcher.png"
          convert "$SRC" -resize 192x192! "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          convert "$SRC" -resize 192x192! "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png"
          echo "Icons injected successfully"

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare ApexTrack.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ApexTrack.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexTrack-GH-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/ApexTrack.apk

      - name: Attach APK to GitHub Release v1.0.5
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.5
          files: android/app/build/outputs/apk/debug/ApexTrack.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS Xcode Workspace
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Xcode Project
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          else
            xcodebuild -resolvePackageDependencies -project App.xcodeproj || true
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=NO build
          fi

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexTrack-GH-iOS-Xcode-Build
          path: ios/App
