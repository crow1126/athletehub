name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest

    env:
      # Provide dummy env vars so Next.js doesn't bail out at build time
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy
      MOOLRE_BASE_URL: https://api.moolre.com
      MOOLRE_API_USER: "0"
      MOOLRE_PUBLIC_KEY: dummy
      MOOLRE_SECRET_KEY: dummy
      MOOLRE_API_KEY: dummy
      MOOLRE_ACCOUNT_NUMBER: "0"
      MOOLRE_VAS_KEY: dummy
      MOOLRE_WEBHOOK_SECRET: dummy
      CRON_SECRET: dummy
      NEXT_PUBLIC_ENABLE_SIMULATION: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check (TypeScript)
        run: npx tsc --noEmit
        # tsc may not exist if tsconfig doesn't cover JS files — soft-fail OK
        continue-on-error: true

      - name: Run unit tests
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test

      - name: Build (production bundle)
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high
        # Warn but don't fail CI — dependency audits may have false positives
        continue-on-error: true

  deploy-check:
    name: Deployment Gate
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'

    steps:
      - name: All checks passed — ready for Vercel deployment
        run: echo "✅ Quality gate passed. Vercel will auto-deploy from main."
